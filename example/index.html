<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Augur – Bitcoin Fee Estimates</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    color: #e0e0e0;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    padding: 2rem;
  }
  a { color: #f7931a; }
  a:hover { color: #fdb34d; }
  h1 {
    color: #f7931a;
    font-size: 1.6rem;
    margin-bottom: 0.3rem;
  }
  .subtitle {
    color: #777;
    font-size: 0.85rem;
    margin-bottom: 1.2rem;
  }
  .api-link {
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
  }
  .table-wrap {
    display: inline-block;
  }
  #status {
    font-size: 0.75rem;
    color: #555;
    margin-top: 0.8rem;
    text-align: center;
  }
  #error {
    color: #ff4444;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    display: none;
  }
  table {
    border-collapse: collapse;
    width: auto;
  }
  th, td {
    padding: 0.5rem 1rem;
    text-align: right;
    border: 1px solid #2a2a2a;
  }
  th {
    background: #1a1a1a;
    color: #f7931a;
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  th:first-child {
    text-align: left;
  }
  td:first-child {
    text-align: left;
    color: #999;
    font-weight: 500;
  }
  tr:hover td {
    background: #1a1406;
  }
  td.fee {
    color: #f7931a;
    font-variant-numeric: tabular-nums;
  }
  .unit {
    color: #555;
    font-size: 0.75rem;
  }
</style>
</head>
<body>
<h1>Bitcoin Fee Estimates</h1>
<p class="api-link">
source code: <br/>
<a href="https://github.com/lnliz/go-bitcoin-augur">github.com/lnliz/go-bitcoin-augur</a>

</p>
<p class="api-link">
json fee endpoint: <br/>
<a href="{{.}}/fees.json">{{.}}/fees.json</a>
</p>
<p id="error"></p>
<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>Blocks</th>
      <th>50%</th>
      <th>80%</th>
      <th>95%</th>
    </tr>
  </thead>
  <tbody id="fees"></tbody>
</table>
<p id="status"></p>
</div>
<script>
const BASE = {{.}};
const TARGETS = [3,6,9,12,18,24,36,48,72,96,144];
const PROBS = ["0.50","0.80","0.95"];

function formatFee(v) {
  return v != null ? v.toFixed(2) : "–";
}

async function load() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const r = await fetch(BASE + "/fees.json", {signal: controller.signal});
    if (!r.ok) throw new Error(r.status + " " + r.statusText);
    const d = await r.json();
    const tbody = document.getElementById("fees");
    let html = "";
    for (const t of TARGETS) {
      const e = d.estimates[String(t)];
      html += "<tr><td>" + t + " blocks</td>";
      for (const p of PROBS) {
        const fee = e && e.probabilities[p] ? e.probabilities[p].fee_rate : null;
        html += '<td class="fee">' + formatFee(fee) + ' <span class="unit">sat/vB</span></td>';
      }
      html += "</tr>";
    }
    tbody.innerHTML = html;
    document.getElementById("status").textContent = "Updated: " + d.mempool_update_time;
    document.getElementById("error").style.display = "none";
  } catch(e) {
    document.getElementById("fees").replaceChildren();
    document.getElementById("status").textContent = "";
    document.getElementById("error").textContent = "Error loading fees: " + e.message;
    document.getElementById("error").style.display = "block";
  } finally {
    clearTimeout(timeout);
    // Only one request may be active: an older response must never overwrite
    // a newer estimate, and stalled requests must clear the displayed fees.
    setTimeout(load, 15000);
  }
}

load();
</script>
</body>
</html>
